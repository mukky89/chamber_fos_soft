name: build

# Builds the whole solution — including the WPF desktop app (VotschVc3.App),
# which only compiles on Windows — and runs the test suite on every push and
# pull request.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync 1.76.6 changelog
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Encoding UTF8 CHANGELOG.md
          if ($content -notmatch '## \[1\.76\.6\]') {
            $patch = Get-Content -Raw -Encoding UTF8 CHANGELOG_1.76.6.md
            $patchBody = $patch -replace '^# Changelog — 1\.76\.6\r?\n\r?\n', ''
            $entry = "## [1.76.6] – 2026-09-02`r`n`r`n" + $patchBody.Trim() + "`r`n"
            $content = $content -replace '(## \[Nezverejnené\]\r?\n)', ('$1`r`n' + $entry)
            [System.IO.File]::WriteAllText((Resolve-Path CHANGELOG.md), $content, [System.Text.UTF8Encoding]::new($false))
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CHANGELOG.md
            git commit -m 'Update CHANGELOG for 1.76.6'
            git push
          }

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/install-lab-bridge-task.ps1',
            'scripts/verify-dashboard-bridge-v2.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $file"
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VotschVc3.sln

      - name: Build (Release)
        run: dotnet build VotschVc3.sln -c Release --no-restore

      - name: Test
        run: dotnet test VotschVc3.sln -c Release --no-build --verbosity normal

      - name: Publish app (single-file, framework-dependent win-x64)
        run: >-
          dotnet publish src/VotschVc3.App/VotschVc3.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true
          -p:DebugType=none
          -o publish/VotschVc3.App

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: VotschVc3.App
          path: publish/VotschVc3.App/VotschVc3.App.exe
