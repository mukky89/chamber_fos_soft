name: Apply 1.76.6 changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply 1.76.6 changelog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepend release entry to CHANGELOG.md
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changelog = Path('CHANGELOG.md')
          patch = Path('CHANGELOG_1.76.6.md').read_text(encoding='utf-8')
          body = patch.split('\n', 1)[1] if '\n' in patch else patch
          current = changelog.read_text(encoding='utf-8')
          marker = '## [Nezverejnené]'
          if '## [1.76.6]' not in current:
              current = current.replace(marker, marker + '\n\n## [1.76.6] – 2026-09-02\n\n' + body.split('\n', 2)[-1], 1)
              changelog.write_text(current, encoding='utf-8', newline='\n')
          PY

      - name: Commit changelog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m 'Update CHANGELOG for 1.76.6'
          git push
