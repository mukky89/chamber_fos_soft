# Builds and tests the VotschVc3 WPF desktop app (.NET 8) on Windows.
# For more information on GitHub Actions, refer to https://github.com/features/actions

name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: VotschVc3.sln
      Test_Project_Path: tests/VotschVc3.Core.Tests/VotschVc3.Core.Tests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --configuration $env:Configuration --no-restore
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Test
      run: dotnet test $env:Test_Project_Path --configuration $env:Configuration --no-build --verbosity normal
      env:
        Configuration: ${{ matrix.configuration }}

    # Publish a runnable build of the WPF app (Release only) and upload it.
    - name: Publish app
      if: matrix.configuration == 'Release'
      run: dotnet publish src/VotschVc3.App/VotschVc3.App.csproj --configuration Release --no-build --output publish

    - name: Upload build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: VotschVc3-app
        path: publish
